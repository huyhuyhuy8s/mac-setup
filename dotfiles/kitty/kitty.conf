# ~/.config/kitty/kitty.conf  (macOS-adapted)
# Theme colors baked in from the Omarchy "terminus" theme (originally an
# `include ~/.local/state/omarchy/current/theme/kitty.conf`, which does not
# exist on macOS). Re-theme by editing theme.conf.
include ~/.config/kitty/theme.conf

# Font
font_family Maple Mono NF
bold_italic_font auto
font_size        12.5

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.70
background_blur 1

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# macOS: make Option act as Alt/Meta so the tmux M-* bindings work
# (M-Enter split, M-Escape kill-pane, M-Left/M-Right windows, ...).
# Use `left` instead of `yes` if you want the left Option key to keep typing
# special characters.
macos_option_as_alt yes

# Allow remote access
# allow_remote_control yes

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Smooth Cursor
cursor_trail 4
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Match monitor refresh rate
repaint_delay 10
sync_to_monitor yes
input_delay 0
wheel_scroll_multiplier 3.0

# The original config pointed kitty's remote-control socket at
# ${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid} for Omarchy/Hyprland cwd lookup.
# macOS has no XDG_RUNTIME_DIR and no Hyprland, so it is disabled by default.
# If you need the remote-control socket, uncomment (keep the path < ~104 chars):
# listen_on unix:/tmp/kitty-{kitty_pid}
